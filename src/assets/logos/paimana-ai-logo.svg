<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 48" fill="none" role="img" aria-label="PAIMANA AI dimensional logo">
  <defs>
    <!-- Dimensional Navy Shield Gradient -->
    <linearGradient id="shieldFace" x1="3" y1="3" x2="45" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#173D73" />
      <stop offset="55%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#061428" />
    </linearGradient>
    <linearGradient id="shieldBevel" x1="3" y1="3" x2="45" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#1E3A5F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="aiBadgeGrad" x1="142" y1="10" x2="170" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13315C" />
      <stop offset="100%" stop-color="#07162B" />
    </linearGradient>
    <filter id="emblemDrop" x="0" y="0" width="52" height="52" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#081B33" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Dimensional Emblem Badge -->
  <g filter="url(#emblemDrop)">
    <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#shieldFace)" stroke="url(#shieldBevel)" stroke-width="1.25" />
    <!-- Top Inner Specular Rim -->
    <path d="M12 4.2H36" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" stroke-linecap="round" />

    <!-- Extruded 3D Infrastructure Pillars (Front + Shaded Side Faces) -->
    <!-- Pillar 1 -->
    <rect x="10.5" y="25" width="4.2" height="10.5" rx="0.8" fill="#F1F5F9" />
    <path d="M14.7 25.4L16.3 24.4V34.5L14.7 35.5Z" fill="#94A3B8" />
    <!-- Pillar 2 -->
    <rect x="18.2" y="19.5" width="4.4" height="16" rx="0.8" fill="#38BDF8" />
    <path d="M22.6 19.9L24.3 18.8V34.4L22.6 35.5Z" fill="#0284C7" />
    <!-- Pillar 3 -->
    <rect x="26.2" y="13.5" width="4.6" height="22" rx="0.8" fill="#FFFFFF" />
    <path d="M30.8 13.9L32.6 12.8V34.3L30.8 35.5Z" fill="#CBD5E1" />

    <!-- Curved Indian Tricolour Infrastructure Span across Base -->
    <path d="M7.5 34.5C15.5 30.8 32.5 30.8 40.5 34.5" stroke="#FF9933" stroke-width="2.2" stroke-linecap="round" />
    <path d="M7.5 37.1C15.5 33.4 32.5 33.4 40.5 37.1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M7.5 39.7C15.5 36.0 32.5 36.0 40.5 39.7" stroke="#138808" stroke-width="2.2" stroke-linecap="round" />

    <!-- Elevated Blue Data-Wheel Hub -->
    <circle cx="35.5" cy="14" r="5.6" fill="#081B33" stroke="#38BDF8" stroke-width="1.4" />
    <circle cx="35.5" cy="14" r="3" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.8" stroke-dasharray="1.5 1.5" />
    <circle cx="35.5" cy="14" r="1.6" fill="#FF9933" />
  </g>

  <!-- Primary Wordmark -->
  <text x="54" y="25" fill="#081B33" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.35">PAIMANA</text>

  <!-- Dimensional AI Tile with Tricolour Accent Top -->
  <rect x="142" y="10.5" width="27" height="17" rx="4" fill="url(#aiBadgeGrad)" stroke="#1E3A5F" stroke-width="0.9" />
  <rect x="144.5" y="10.8" width="7.3" height="1.8" rx="0.9" fill="#FF9933" />
  <rect x="151.8" y="10.8" width="7.4" height="1.8" fill="#FFFFFF" />
  <rect x="159.2" y="10.8" width="7.3" height="1.8" rx="0.9" fill="#138808" />
  <text x="155.5" y="23.2" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">AI</text>

  <!-- Crisp Subtitle -->
  <text x="54.5" y="38" fill="#334155" font-family="'Public Sans', system-ui, -apple-system, sans-serif" font-size="8.2" font-weight="700" letter-spacing="0.45">INFRASTRUCTURE ANALYTICS</text>
</svg>
