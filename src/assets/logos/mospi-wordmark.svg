<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 48" fill="none" role="img" aria-label="India-inspired Ministry of Statistics and Programme Implementation wordmark">
  <defs>
    <radialGradient id="wheelBg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2ECF7" />
    </radialGradient>
  </defs>

  <!-- Dimensional Blue Data-Wheel Emblem Framed by Tricolour Arcs (Original Artwork) -->
  <g transform="translate(3, 5)">
    <path d="M6.5 9.5C10.5 4.2 16.8 1.8 23.2 2.6" stroke="#FF9933" stroke-width="2.6" stroke-linecap="round" />
    <path d="M6.5 28.5C10.5 33.8 16.8 36.2 23.2 35.4" stroke="#138808" stroke-width="2.6" stroke-linecap="round" />

    <circle cx="19" cy="19" r="12" fill="url(#wheelBg)" stroke="#0B2545" stroke-width="1.9" />
    <circle cx="19" cy="19" r="7.2" stroke="#0284C7" stroke-width="1.25" stroke-dasharray="2.4 1.8" />
    <circle cx="19" cy="19" r="2.8" fill="#0B2545" />
    <circle cx="19" cy="19" r="1.1" fill="#FF9933" />

    <!-- 8 Data Spokes -->
    <path d="M19 7.2V12M19 26V30.8M7.2 19H12M26 19H30.8M10.7 10.7L14.1 14.1M23.9 23.9L27.3 27.3M27.3 10.7L23.9 14.1M14.1 23.9L10.7 27.3" stroke="#1D4ED8" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Coordinated Two-Line Institutional Wordmark -->
  <text x="44" y="17.5" fill="#334155" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="700" letter-spacing="0.48">MINISTRY OF STATISTICS AND</text>
  <text x="44" y="30.5" fill="#081B33" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="800" letter-spacing="0.25">PROGRAMME IMPLEMENTATION</text>

  <!-- Crisp Tricolour Accent Rule -->
  <rect x="44" y="36.5" width="59" height="2.4" rx="1.2" fill="#FF9933" />
  <rect x="105" y="36.5" width="48" height="2.4" rx="1.2" fill="#CBD5E1" />
  <rect x="155" y="36.5" width="59" height="2.4" rx="1.2" fill="#138808" />
</svg>
